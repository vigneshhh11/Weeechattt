<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>privatttcyy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background-color: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background-color: #111;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #333;
        }
        
        .header h1 {
            color: #fff;
            font-size: 2.5rem;
        }
        
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100%;
            padding: 20px;
        }
        
        .chat-container {
            display: none;
            flex-direction: column;
            height: 100%;
        }
        
        .login-form {
            background-color: #222;
            padding: 30px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
        }
        
        .login-form h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            background-color: #333;
            border: none;
            border-radius: 5px;
            color: #fff;
        }
        
        .error-message {
            color: #ff5555;
            margin-top: 10px;
            text-align: center;
            display: none;
        }

        .message-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        
        .message {
            background-color: #222;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 5px;
            border-left: 3px solid #444;
        }
        
        .message-sender {
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 5px;
        }
        
        .message-time {
            font-size: 0.8rem;
            color: #aaa;
            margin-top: 5px;
            text-align: right;
        }
        
        .input-container {
            display: flex;
            padding: 20px;
            border-top: 1px solid #333;
        }
        
        .input-container input {
            flex: 1;
            padding: 12px;
            background-color: #333;
            border: none;
            border-radius: 5px;
            color: #fff;
            margin-right: 10px;
        }
        
        .input-container button {
            padding: 12px 25px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s;
        }
        
        .input-container button:hover {
            background-color: #45a049;
        }

        .login-button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s;
        }
        
        .login-button:hover {
            background-color: #45a049;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #4CAF50;
            color: white;
            padding: 15px;
            border-radius: 5px;
            z-index: 1000;
            display: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>privatttcyy</h1>
    </div>
    
    <div class="login-container" id="loginContainer">
        <div class="login-form">
            <h2>Login to Chat</h2>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password">
            </div>
            <div class="error-message" id="errorMessage">Password is wrong</div>
            <button class="login-button" id="loginButton">Login</button>
        </div>
    </div>
    
    <div class="chat-container" id="chatContainer">
        <div class="message-container" id="messageContainer">
            <!-- Messages will appear here -->
        </div>
        <div class="input-container">
            <input type="text" id="messageInput" placeholder="Type a message...">
            <button id="sendButton">Send</button>
        </div>
    </div>
    
    <div class="notification" id="notification">
        You have logged in to the chat
    </div>

    <script>
        // Login functionality
        const loginContainer = document.getElementById('loginContainer');
        const chatContainer = document.getElementById('chatContainer');
        const loginButton = document.getElementById('loginButton');
        const errorMessage = document.getElementById('errorMessage');
        const passwordInput = document.getElementById('password');
        const usernameInput = document.getElementById('username');
        const notification = document.getElementById('notification');
        
        const CORRECT_PASSWORD = "1234";
        
        loginButton.addEventListener('click', () => {
            if (passwordInput.value === CORRECT_PASSWORD) {
                const username = usernameInput.value.trim();
                if (username === '') {
                    errorMessage.textContent = 'Please enter a username';
                    errorMessage.style.display = 'block';
                    return;
                }
                
                // Store username in session storage
                sessionStorage.setItem('chatUsername', username);
                
                // Hide login, show chat
                loginContainer.style.display = 'none';
                chatContainer.style.display = 'flex';
                
                // Show notification
                showNotification('You have logged in to the chat');
                
                // Focus on message input
                document.getElementById('messageInput').focus();
            } else {
                errorMessage.style.display = 'block';
                passwordInput.value = '';
            }
        });
        
        function showNotification(message) {
            notification.textContent = message;
            notification.style.display = 'block';
            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }
        
        // Chat functionality
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const messageContainer = document.getElementById('messageContainer');
        
        // Check if user is already logged in
        if (sessionStorage.getItem('chatUsername')) {
            loginContainer.style.display = 'none';
            chatContainer.style.display = 'flex';
            messageInput.focus();
        }
        
        // Send message on button click or Enter key
        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        
        function sendMessage() {
            const messageText = messageInput.value.trim();
            const username = sessionStorage.getItem('chatUsername') || 'Anonymous';
            
            if (messageText !== '') {
                // Create message element
                const messageElement = document.createElement('div');
                messageElement.className = 'message';
                
                const senderElement = document.createElement('div');
                senderElement.className = 'message-sender';
                senderElement.textContent = username;
                
                const textElement = document.createElement('div');
                textElement.textContent = messageText;
                
                const timeElement = document.createElement('div');
                timeElement.className = 'message-time';
                timeElement.textContent = new Date().toLocaleTimeString();
                
                messageElement.appendChild(senderElement);
                messageElement.appendChild(textElement);
                messageElement.appendChild(timeElement);
                
                // Add to message container
                messageContainer.appendChild(messageElement);
                
                // Clear input
                messageInput.value = '';
                
                // Scroll to bottom
                messageContainer.scrollTop = messageContainer.scrollHeight;
                
                // Broadcast message to all users in the same chat room
                // In a real implementation, this would use WebSockets or similar
                // For this demo, messages are only visible to the sender
            }
        }
        
        // Auto-focus username input on page load
        window.addEventListener('DOMContentLoaded', () => {
            usernameInput.focus();
        });
    </script>
</body>
</html>
