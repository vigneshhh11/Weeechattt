    <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>privatttcyy</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Arial', sans-serif;
}
body {
    background-color: #000;
    color: #fff;
    height: 100vh;
    display: flex;
    flex-direction: column;
}
.header {
    background-color: #111;
    padding: 20px;
    text-align: center;
    border-bottom: 1px solid #333;
}
.header h1 {
    font-size: 2.5rem;
}
.login-container {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    height: 100%;
    padding: 20px;
}
.chat-container {
    display: none;
    flex-direction: column;
    height: 100%;
}
.login-form {
    background-color: #222;
    padding: 30px;
    border-radius: 10px;
    width: 100%;
    max-width: 400px;
}
.login-form h2 {
    text-align: center;
    margin-bottom: 20px;
}
.form-group {
    margin-bottom: 20px;
}
.form-group input {
    width: 100%;
    padding: 12px;
    background-color: #333;
    border: none;
    border-radius: 5px;
    color: #fff;
}
.error-message {
    color: #ff5555;
    text-align: center;
    display: none;
}
.message-container {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
}
.message {
    background-color: #222;
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 5px;
}
.message-sender {
    font-weight: bold;
    color: #4CAF50;
}
.message-time {
    font-size: 0.8rem;
    color: #aaa;
    text-align: right;
}
.input-container {
    display: flex;
    padding: 20px;
    border-top: 1px solid #333;
}
.input-container input {
    flex: 1;
    padding: 12px;
    background-color: #333;
    border: none;
    border-radius: 5px;
    color: #fff;
}
.input-container button {
    padding: 12px 20px;
    background-color: #4CAF50;
    border: none;
    color: white;
    margin-left: 10px;
    border-radius: 5px;
    cursor: pointer;
}
.login-button {
    width: 100%;
    padding: 12px;
    background-color: #4CAF50;
    border: none;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}
.notification {
    position: fixed;
    top: 20px;
    right: 20px;
    background-color: #4CAF50;
    padding: 10px;
    display: none;
}
</style>
</head>

<body>

<div class="header">
    <h1>privatttcyy</h1>
</div>

<div class="login-container" id="loginContainer">
    <div class="login-form">
        <h2>Login</h2>
        <input type="text" id="username" placeholder="Username"><br><br>
        <input type="password" id="password" placeholder="Password"><br><br>
        <div class="error-message" id="errorMessage">Wrong password</div><br>
        <button class="login-button" id="loginButton">Login</button>
    </div>
</div>

<div class="chat-container" id="chatContainer">
    <div class="message-container" id="messageContainer"></div>
    <div class="input-container">
        <input type="text" id="messageInput" placeholder="Type message...">
        <button id="sendButton">Send</button>
    </div>
</div>

<div class="notification" id="notification"></div>

<!-- ✅ FIXED SOCKET.IO -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script>
const socket = io("https://weeechattt.onrender.com", {
    transports: ["websocket", "polling"],
    reconnection: true
});

socket.on("connect", () => console.log("Connected"));
socket.on("disconnect", () => console.log("Disconnected"));

const loginBtn = document.getElementById("loginButton");
const loginContainer = document.getElementById("loginContainer");
const chatContainer = document.getElementById("chatContainer");
const errorMsg = document.getElementById("errorMessage");

loginBtn.onclick = () => {
    const user = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value;

    if (pass !== "1234") {
        errorMsg.style.display = "block";
        return;
    }

    if (!user) return;

    sessionStorage.setItem("user", user);
    loginContainer.style.display = "none";
    chatContainer.style.display = "flex";
};

const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendButton");
const container = document.getElementById("messageContainer");

sendBtn.onclick = sendMessage;
input.addEventListener("keypress", e => {
    if (e.key === "Enter") sendMessage();
});

function sendMessage() {
    const msg = input.value.trim();
    if (!msg) return;

    socket.emit("send_message", {
        user: sessionStorage.getItem("user"),
        message: msg,
        time: new Date().toLocaleTimeString()
    });

    input.value = "";
}

socket.on("receive_message", addMessage);
socket.on("load_messages", msgs => {
    container.innerHTML = "";
    msgs.forEach(addMessage);
});

function addMessage(data) {
    const div = document.createElement("div");
    div.className = "message";
    div.innerHTML = `
        <div class="message-sender">${data.user}</div>
        <div>${data.message}</div>
        <div class="message-time">${data.time}</div>
    `;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
}
</script>

</body>
</html>
